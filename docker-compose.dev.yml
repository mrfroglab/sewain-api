# Local Postgres + PostGIS for development: make db-up
services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: sewain-dev-db
    environment:
      POSTGRES_USER: sewain
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: sewain
    ports: ["127.0.0.1:55491:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sewain -d sewain"]
      interval: 3s
      retries: 20
