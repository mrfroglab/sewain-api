name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sewain-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -o /dev/null ./cmd/api

  image:
    name: Build & push image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Thinkpad server
    needs: image
    if: github.event_name != 'pull_request' && github.repository_owner == 'mrfroglab'
    runs-on: self-hosted
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull & restart
        run: |
          COMPOSE=/opt/stacks/apps/sewain/docker-compose.yml
          docker compose -f "$COMPOSE" pull api
          docker compose -f "$COMPOSE" up -d --no-deps api
          docker image prune -f
      - name: Verify API is healthy
        run: |
          for _ in $(seq 1 40); do
            s=$(docker inspect -f '{{.State.Health.Status}}' sewain-api 2>/dev/null || true)
            [ "$s" = healthy ] && { echo "sewain-api healthy"; exit 0; }
            sleep 3
          done
          echo "sewain-api is not healthy. Check: docker logs sewain-api" >&2
          docker logs --tail 50 sewain-api >&2 || true
          exit 1
