name: CI/CD

# main    → image :latest  → stack demo    /opt/stacks/apps/sewain          (sewain.hallojanu.me)
# develop → image :develop → stack staging /opt/stacks/apps/sewain-staging  (sewain-staging.hallojanu.me)
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sewain-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -o /dev/null ./cmd/api

  image:
    name: Build & push image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Thinkpad server
    needs: image
    if: >-
      github.event_name != 'pull_request' && github.repository_owner == 'mrfroglab' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: self-hosted
    env:
      STACK: ${{ github.ref == 'refs/heads/main' && '/opt/stacks/apps/sewain' || '/opt/stacks/apps/sewain-staging' }}
      CONTAINER: ${{ github.ref == 'refs/heads/main' && 'sewain-api' || 'sewain-staging-api' }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull & restart
        run: |
          COMPOSE="$STACK/docker-compose.yml"
          docker compose -f "$COMPOSE" pull api
          docker compose -f "$COMPOSE" up -d --no-deps api
          docker image prune -f
      - name: Verify API is healthy
        run: |
          for _ in $(seq 1 40); do
            s=$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || true)
            [ "$s" = healthy ] && { echo "$CONTAINER healthy"; exit 0; }
            sleep 3
          done
          echo "$CONTAINER is not healthy. Check: docker logs $CONTAINER" >&2
          docker logs --tail 50 "$CONTAINER" >&2 || true
          exit 1
